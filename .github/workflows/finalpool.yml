name: Build finalpool

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout finalpool
        uses: actions/checkout@v4
        with:
          ref: finalpool
          fetch-depth: 0

      - name: Build finalpool
        run: python3 scripts/build_finalpool.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
